name: Release

# Publishes the package to npm when a version tag (vX.Y.Z) is pushed.
# Authentication uses npm trusted publishing (OIDC): no token and no one-time password are needed. The trusted publisher
# of the package on npmjs.com must name this repository and this workflow file (release.yml).
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm run test:generator
      - run: npm run check:generated
      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./projects/easy-mat-ui/package.json').version")
          [ "v$PKG_VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"; exit 1; }
      # The notes of the GitHub release are the section of this version in CHANGELOG.md. A tag without a section stops
      # here, before anything is published.
      - name: Release notes from the changelog
        run: node scripts/release-notes.cjs "${GITHUB_REF_NAME#v}" > release-notes.md
      # Publishing twice the same version is an error, so a re-run (or a version published by hand) skips it and still
      # creates the GitHub release.
      - name: Is this version already on npm?
        id: npm
        run: |
          NAME=$(node -p "require('./projects/easy-mat-ui/package.json').name")
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm: publishing is skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing needs npm 11.5.1 or later; the one shipped with Node 22 is older.
      - name: Use a recent npm
        if: steps.npm.outputs.published != 'true'
        run: npm install -g npm@^11.5.1 && npm --version
      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        run: cd dist/easy-mat-ui && npm publish --provenance --access public
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
