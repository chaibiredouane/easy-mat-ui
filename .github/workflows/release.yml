name: Release

# Publishes the package to npm when a version tag (vX.Y.Z) is pushed.
# Requires an npm automation token stored as the repository secret NPM_TOKEN.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - run: npm run test:generator
      - run: npm run check:generated
      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./projects/easy-mat-ui/package.json').version")
          [ "v$PKG_VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"; exit 1; }
      # The notes of the GitHub release are the section of this version in CHANGELOG.md. A tag without a section stops
      # here, before anything is published.
      - name: Release notes from the changelog
        run: node scripts/release-notes.cjs "${GITHUB_REF_NAME#v}" > release-notes.md
      # Publishing twice the same version is an error, so a re-run (or a version published by hand) skips it and still
      # creates the GitHub release.
      - name: Is this version already on npm?
        id: npm
        run: |
          NAME=$(node -p "require('./projects/easy-mat-ui/package.json').name")
          VERSION="${GITHUB_REF_NAME#v}"
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already on npm: publishing is skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.npm.outputs.published != 'true'
        run: cd dist/easy-mat-ui && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
