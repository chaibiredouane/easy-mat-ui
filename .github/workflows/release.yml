name: Release

# Publishes the package to npm when a version tag (vX.Y.Z) is pushed.
# Requires an npm automation token stored as the repository secret NPM_TOKEN.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: npm test
        env:
          CHROME_BIN: /usr/bin/google-chrome
      - name: Check tag matches package version
        run: |
          PKG_VERSION=$(node -p "require('./projects/easy-mat-ui/package.json').version")
          [ "v$PKG_VERSION" = "$GITHUB_REF_NAME" ] || { echo "Tag $GITHUB_REF_NAME does not match package version $PKG_VERSION"; exit 1; }
      - run: cd dist/easy-mat-ui && npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
