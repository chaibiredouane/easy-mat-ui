<lib-easy-page-header
  [config]="{ icon: 'location_city', title: ('pages.cities.title' | translate), subtitle: ('pages.cities.subtitle' | translate) }">
  <app-unit-switch />
</lib-easy-page-header>

<app-continent-nav [isoCodes]="isoCodes()" [(selected)]="continent" />

@if (isReady) {
  <section class="country-bar">
    <div class="picker">
      <!-- The dropdown of easy-mat-ui, in single-choice mode: the list follows the continent chosen above. -->
      <lib-easy-multi-select
        idPrefix="country"
        appearance="outline"
        [single]="true"
        [formField]="true"
        [title]="'pages.cities.COUNTRY'"
        [data]="options()"
        valueField="key"
        displayField="value"
        [selectedData]="selectedOption()"
        (change)="onCountryPick($event)" />
    </div>

    @if (country()) {
      <!-- The country itself is already in the dropdown: only the figures are repeated here. -->
      <div class="stats">
        <lib-easy-stat [config]="{ label: ('pages.cities.STAT_CITIES' | translate), value: cityCount() }" />
        <lib-easy-stat
          [config]="{
            label: ('pages.cities.STAT_TOTAL' | translate),
            value: totalFormatted(),
            hint: totalExact() + ' · ' + ('pages.cities.STAT_TOTAL_HINT' | translate),
            tone: 'accent'
          }" />
      </div>
    }
  </section>

  <div class="table-wrap">
    <lib-easy-table
      [config]="tableConfig"
      (dialogResult)="onDialogResult($event)"
      (deleteItem)="onDelete($event)">
    </lib-easy-table>
  </div>
}

<app-code-panel folder="pages/cities" />
