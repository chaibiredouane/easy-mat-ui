<app-page-header
  icon="location_city"
  [title]="'pages.cities.title' | translate"
  [subtitle]="'pages.cities.subtitle' | translate">
  <label class="country">
    <span>{{ 'pages.cities.COUNTRY' | translate }}</span>
    <select (change)="onCountryChange($event)" [attr.aria-label]="'pages.cities.COUNTRY' | translate">
      @for (c of countries; track c.id) {
        <option [value]="c.id" [selected]="c.id === country.id">{{ countryLabel(c) }}</option>
      }
    </select>
  </label>
  <app-unit-switch />
</app-page-header>

@if (isReady) {
  <div class="table-wrap">
    <lib-easy-table
      [config]="tableConfig"
      (dialogResult)="onDialogResult($event)"
      (deleteItem)="onDelete($event)">
    </lib-easy-table>
  </div>
}

<app-code-panel folder="pages/cities" />
