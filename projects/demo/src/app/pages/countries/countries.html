<lib-easy-page-header
  [config]="{ icon: 'public', title: ('pages.countries.title' | translate), subtitle: ('pages.countries.subtitle' | translate) }">
  <app-unit-switch />
</lib-easy-page-header>

<app-continent-nav [isoCodes]="isoCodes()" [(selected)]="continent" />

@if (isReady) {
  <div class="table-wrap">
    <lib-easy-table
      [config]="tableConfig"
      [childConfig]="tableChildConfig"
      (dialogResult)="onDialogResult($event)"
      (deleteItem)="onDelete($event)"
      (extendRow)="onExtendRow($event)"
      (childDialogResult)="onChildDialogResult($event)"
      (deleteChildItem)="onDeleteChild($event)">
    </lib-easy-table>
  </div>
}

<app-code-panel folder="pages/countries" />
