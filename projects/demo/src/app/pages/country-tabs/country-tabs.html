<app-page-header
  icon="tab"
  [title]="'pages.tabs.title' | translate"
  [subtitle]="'pages.tabs.subtitle' | translate">
  <app-unit-switch />
</app-page-header>

@if (isReady) {
  <div class="table-wrap">
    <lib-easy-table
      [config]="tableConfig"
      [childConfig]="tabsConfig"
      (extendRow)="onExtendRow($event)"
      (childDialogResult)="onChildDialogResult($event)"
      (deleteChildItem)="onDeleteChild($event)">
    </lib-easy-table>
  </div>
}

<app-code-panel folder="pages/country-tabs" />
