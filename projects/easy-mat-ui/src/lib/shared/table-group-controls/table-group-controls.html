@if (visible) {
  <div class="group-controls">
    <button type="button" class="group-control" [disabled]="allExpanded" (click)="expandAll.emit()">
      <mat-icon>unfold_more</mat-icon>
      <span>{{ (groupBy.expandAllLabel ?? 'Expand all') | translate }}</span>
    </button>
    <button type="button" class="group-control" [disabled]="allCollapsed" (click)="collapseAll.emit()">
      <mat-icon>unfold_less</mat-icon>
      <span>{{ (groupBy.collapseAllLabel ?? 'Collapse all') | translate }}</span>
    </button>
  </div>
}
