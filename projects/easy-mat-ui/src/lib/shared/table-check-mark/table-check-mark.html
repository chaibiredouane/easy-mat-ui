<button type="button"
        class="check"
        [class.checked]="state === 'all'"
        [class.mixed]="state === 'some'"
        [class.static]="readonlyLook"
        [disabled]="disabled"
        role="checkbox"
        [attr.aria-checked]="state === 'some' ? 'mixed' : state === 'all'"
        [attr.aria-label]="label"
        (click)="$event.stopPropagation(); toggled.emit()">
  @if (state === 'some') {
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 8h8"/></svg>
  } @else {
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5"/></svg>
  }
</button>
