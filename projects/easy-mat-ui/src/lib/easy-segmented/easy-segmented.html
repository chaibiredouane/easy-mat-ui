<div
  class="seg"
  [class.lg]="size === 'lg'"
  [class.stretch]="stretch"
  [class.collapse-inactive]="collapseInactive"
  [attr.role]="semantics === 'tab' ? 'tablist' : 'radiogroup'"
  [attr.aria-label]="ariaLabel || null"
  (keydown)="onKeydown($event)">
  @for (option of options; track option.id) {
    <button
      type="button"
      [class.on]="option.id === selected"
      [class.icon-only]="iconOnly"
      [attr.role]="semantics === 'tab' ? 'tab' : 'radio'"
      [attr.aria-checked]="semantics === 'radio' ? option.id === selected : null"
      [attr.aria-selected]="semantics === 'tab' ? option.id === selected : null"
      [attr.aria-controls]="semantics === 'tab' && panelId ? panelId : null"
      [attr.aria-label]="iconOnly ? option.hint || option.label || null : null"
      [attr.tabindex]="option.id === tabStopId ? 0 : -1"
      [id]="idPrefix ? idPrefix + option.id : ''"
      [disabled]="!!option.disabled"
      [title]="option.hint || (iconOnly ? option.label || '' : '')"
      (click)="select(option)">
      @if (option.icon) {
        <mat-icon aria-hidden="true">{{ option.icon }}</mat-icon>
      }
      @if (option.label && !iconOnly) {
        <span class="txt">{{ option.label }}</span>
      }
    </button>
  }
</div>
